[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "0.1.0"
description = "Regulated credit-risk decisioning demo: classical ML serving + LLM explainability agent, built on Databricks/Mosaic AI patterns."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "mlflow>=2.14",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "pandas>=2.1",
    "numpy>=1.26",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "streamlit>=1.33",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]
openai = [
    "openai>=1.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
